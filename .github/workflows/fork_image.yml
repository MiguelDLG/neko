name: Fork Image (draw plugin)

# Builds this fork's server + client on top of the upstream app image and
# pushes it to ghcr.io/<org>/neko/<app>. See Dockerfile.overlay.

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'client/**'
      - 'Dockerfile.overlay'
      - '.github/workflows/fork_image.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Upstream app image to layer on (firefox, chromium, ...)'
        required: false
        default: 'firefox'
      base_tag:
        description: 'Upstream image tag to layer on'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build ${{ github.event.inputs.app || 'firefox' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP: ${{ github.event.inputs.app || 'firefox' }}
      BASE_TAG: ${{ github.event.inputs.base_tag || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.APP }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.overlay
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/m1k1o/neko/${{ env.APP }}:${{ env.BASE_TAG }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
